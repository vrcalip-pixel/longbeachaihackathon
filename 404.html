<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — AI Hackathon</title>
<noscript><meta http-equiv="refresh" content="4;url=./"></noscript>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#07172B;color:#EAF6FA;font-family:"Space Grotesk",Helvetica,Arial,sans-serif;
    text-align:center;padding:24px}
  h1{font-size:clamp(30px,7vw,60px);margin:0 0 14px;text-transform:uppercase;letter-spacing:-.02em}
  p{color:#B9CFE2;margin:0 0 26px}
  a{display:inline-block;background:#FFB81C;color:#07172B;text-decoration:none;font-weight:700;
    padding:12px 22px;border:2px solid #07172B;box-shadow:5px 5px 0 rgba(0,0,0,.4)}
</style>
</head>
<body>
  <div>
    <h1>Wrong turn.</h1>
    <p>That page doesn't exist. Taking you back to the hackathon…</p>
    <a id="home" href="/">Go to the hackathon</a>
  </div>
<script>
/* On a GitHub project page the site lives at /repo-name/, not at /. Sending
   people to "/" drops them on the account root. Work out the real base:
   github.io  -> /<first-path-segment>/     custom domain -> / */
(function(){
  var base = '/';
  if (location.hostname.indexOf('github.io') !== -1){
    var seg = location.pathname.split('/')[1];
    if (seg) base = '/' + seg + '/';
  }
  document.getElementById('home').setAttribute('href', base);
  setTimeout(function(){ location.replace(base); }, 4000);
})();
</script>
</body>
</html>
